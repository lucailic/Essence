# Interroge la base Supabase deux fois par jour
# pour éviter que le projet gratuit soit mis en pause.
# Lit l'URL et la clé directement dans config.js.

name: Garder Supabase actif

on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Appeler la base
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']+" config.js)
          AUTH=()
          if [[ "$KEY" == eyJ* ]]; then AUTH=(-H "Authorization: Bearer $KEY"); fi
          curl --fail-with-body --silent --show-error -X POST "${URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $KEY" "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Base active."
